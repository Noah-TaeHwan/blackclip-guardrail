# PyPI 발행(Trusted Publishing, GitHub OIDC). 토큰 · 비밀 값 없음.
# 초안: 레포 공개 뒤 PyPI 쪽 pending publisher(프로젝트 blackclip-guardrail · 이 레포 · publish.yml · 환경 pypi)를 등록한 다음에만 돈다.
# GitHub Release를 publish하면 실행된다. 액션은 커밋 SHA로 고정(괄호 안 태그, 2주 넘은 판).
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # 레포 설정에서 승인자를 걸어 두면 사람이 한 번 더 누른다
    permissions:
      id-token: write  # PyPI Trusted Publishing에 필요한 유일한 권한
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
